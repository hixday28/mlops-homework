[project]
name = "mlops-hw4"
version = "0.1.0"
description = "MLOPS-26, домашняя работа 4: токенизация, chat template, маскирование лосса"
requires-python = ">=3.12,<3.13"
# Нижние границы, а не точные пины: точные версии фиксирует uv.lock.
# transformers>=4.51 — раньше в apply_chat_template не было enable_thinking для Qwen3.
dependencies = [
    "torch==2.8.0",
    "transformers==4.57.1",
    "numpy>=2.1",
    "pyyaml>=6.0",
    "dvc==3.67.1",
]
