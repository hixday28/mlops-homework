dependencies = [
    "torch==2.8.0",
    "transformers==4.57.1",
    "peft==0.17.1",
    "numpy>=2.1",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "psutil>=5.9",
    "dvc==3.67.1",
]
