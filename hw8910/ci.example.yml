# Пример; не установлен в .github/workflows и не является удалённым CI run.
name: Fast release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hw8910
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen
      - run: make check
        env:
          HF_HUB_OFFLINE: '1'
